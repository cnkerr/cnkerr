name: Generate Flatground social preview

on:
  push:
    branches: [flatground-next]
    paths:
      - "notes/projects/flatground-tricks-og.html"
      - "notes/projects/flatground-tricks-data.js"
      - ".github/workflows/generate-flatground-og.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Render 1200x630 preview
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/flatground-og-http.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/notes/projects/flatground-tricks-og.html >/dev/null && break
            sleep 1
          done
          node - <<'NODE'
          const { chromium } = require("@playwright/test");
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1200,height:630},deviceScaleFactor:1});
            await page.goto("http://127.0.0.1:4173/notes/projects/flatground-tricks-og.html",{waitUntil:"networkidle"});
            await page.screenshot({path:"assets/flatground-tricks-og.png"});
            await browser.close();
          })();
          NODE
      - name: Commit preview image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/flatground-tricks-og.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Generate Flatground social preview"
          git push origin HEAD:flatground-next
