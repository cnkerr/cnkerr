name: Validate Flatground Tricks data

on:
  pull_request:
    paths:
      - "notes/projects/flatground-tricks.html"
      - "notes/projects/flatground-tricks-source.json"
      - "notes/projects/flatground-tricks-data.js"
      - "notes/projects/flatground-tricks-data.csv"
      - "scripts/validate-flatground-tricks.mjs"
      - "scripts/flatground-sync.mjs"
      - "scripts/diagnose-flatground-video-embeds.mjs"
      - ".github/workflows/validate-flatground.yml"
  push:
    branches: [main]
    paths:
      - "notes/projects/flatground-tricks.html"
      - "notes/projects/flatground-tricks-source.json"
      - "notes/projects/flatground-tricks-data.js"
      - "notes/projects/flatground-tricks-data.csv"
      - "scripts/validate-flatground-tricks.mjs"
      - "scripts/flatground-sync.mjs"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify generated files and validate data
        run: node scripts/flatground-sync.mjs --check
      - name: Diagnose YouTube source embeds
        run: node scripts/diagnose-flatground-video-embeds.mjs
      - name: Exercise Part IX ingestion in disposable copy
        shell: bash
        run: |
          TMP="$(mktemp -d)"
          cp -a . "$TMP/repo"
          cd "$TMP/repo"
          node - <<'NODE' > /tmp/flatground-part9-test.json
          const rows = Array.from({length:100}, (_,i) => ({
            num:801+i,
            name:`qa future trick ${801+i}`,
            family:"Ollie / Spins",
            subfamily:"None",
            modifiers:[],
            stance:["Regular","Switch","Nollie","Fakie"][i%4],
            siblingKey:`qa future trick ${801+i}`,
            part:9,
            seconds:i+1,
            url:"https://www.youtube.com/watch?v=8bxg4YCo2RE"
          }));
          process.stdout.write(JSON.stringify(rows,null,2));
          NODE
          node scripts/flatground-sync.mjs --append /tmp/flatground-part9-test.json
          node -e 'const d=require("./notes/projects/flatground-tricks-source.json"); if(d.length!==900) process.exit(1)'
          grep -q '900 / 900' notes/projects/flatground-tricks.html
          test "$(wc -l < notes/projects/flatground-tricks-data.csv)" -eq 901
          node scripts/flatground-sync.mjs --check
      - name: Browser smoke test
        shell: bash
        run: |
          COUNT="$(node -e 'const d=require("./notes/projects/flatground-tricks-source.json"); process.stdout.write(String(d.length))')"
          python3 -m http.server 8765 >/tmp/flatground-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 1
          BROWSER="$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          test -n "$BROWSER"
          "$BROWSER" --headless --no-sandbox --disable-gpu --virtual-time-budget=5000             --dump-dom "http://127.0.0.1:8765/notes/projects/flatground-tricks.html?intro=0" > /tmp/flatground-default.html
          grep -q "data-num=\"$COUNT\"" /tmp/flatground-default.html
          grep -q "id=\"matchCount\" aria-live=\"polite\" aria-atomic=\"true\">$COUNT / $COUNT<" /tmp/flatground-default.html
          grep -q 'data-num="1".*tabindex="0"' /tmp/flatground-default.html
          grep -q 'data-num="2".*tabindex="-1"' /tmp/flatground-default.html
          "$BROWSER" --headless --no-sandbox --disable-gpu --virtual-time-budget=5000             --dump-dom "http://127.0.0.1:8765/notes/projects/flatground-tricks.html?intro=0&q=laser" > /tmp/flatground-search.html
          grep -q 'lazer flip' /tmp/flatground-search.html
          ! grep -q 'NO MATCHING TRICKS' /tmp/flatground-search.html
          "$BROWSER" --headless --no-sandbox --disable-gpu --virtual-time-budget=5000             --dump-dom "http://127.0.0.1:8765/notes/projects/flatground-tricks.html?intro=0#trick-413" > /tmp/flatground-deeplink.html
          grep -q 'id="barTitle">#413<' /tmp/flatground-deeplink.html
          grep -q 'id="trickLabel">switch frontside 360 kickflip<' /tmp/flatground-deeplink.html
