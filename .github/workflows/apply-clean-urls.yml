name: Apply clean URL update

on:
  push:
    branches:
      - add-editing-development

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: add-editing-development
          fetch-depth: 0

      - name: Apply clean URL patch
        run: python scripts/apply_clean_urls.py

      - name: Commit clean URL changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No clean URL changes to commit."
            exit 0
          fi
          git commit -m "Use clean portfolio URLs"
          git push origin HEAD:add-editing-development
