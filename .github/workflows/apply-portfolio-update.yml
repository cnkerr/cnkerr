name: Apply portfolio update

on:
  push:
    branches:
      - add-editing-development

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: add-editing-development
          fetch-depth: 0

      - name: Apply exact portfolio edits
        run: python scripts/apply_portfolio_update.py

      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js index.html
          if git diff --cached --quiet; then
            echo "No portfolio changes to commit."
            exit 0
          fi
          git commit -m "Add editing and development portfolio sections"
          git push origin HEAD:add-editing-development
