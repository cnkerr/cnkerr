<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=1200,height=630,initial-scale=1">
<title>Flatground Tricks social card</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:#bfbfbf;font-family:ui-monospace,Menlo,Monaco,Consolas,monospace;color:#000;padding:38px}
.frame{width:100%;height:100%;background:#b7b7b7;border:3px solid;border-color:#fff #000 #000 #fff;padding:22px;box-shadow:5px 5px 0 rgba(0,0,0,.24)}
.paper{height:100%;background:#fff;border:2px solid #000;padding:44px 52px 36px;display:grid;grid-template-rows:auto 1fr auto}
.kicker{font-family:Arial,sans-serif;font-size:18px;font-weight:700;letter-spacing:.22em;margin-bottom:8px}
.title{font-family:"Times New Roman",Times,serif;font-size:72px;font-weight:700;line-height:.92;letter-spacing:-.035em;white-space:nowrap}
.subtitle{font-family:Arial,sans-serif;font-size:19px;font-style:italic;margin-top:13px}
.rule{height:3px;background:#000;margin:31px 0 25px}
.grid{display:grid;grid-template-columns:repeat(100,1fr);gap:3px;align-content:start}
.cell{aspect-ratio:1/1;box-shadow:inset 1px 1px 0 rgba(255,255,255,.3),inset -1px -1px 0 rgba(0,0,0,.3)}
.footer{display:flex;justify-content:space-between;align-items:end;font-size:15px;font-weight:800;letter-spacing:.07em}
.legend{display:flex;gap:22px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.swatch{width:11px;height:11px;border:1px solid rgba(0,0,0,.55)}
</style>
</head>
<body>
<div class="frame"><div class="paper">
  <div>
    <div class="kicker">A COMPENDIUM OF</div>
    <div class="title">FLATGROUND TRICKS</div>
    <div class="subtitle">(as performed by Jamie Griffin)</div>
    <div class="rule"></div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="footer">
    <div class="legend">
      <span><i class="swatch" style="background:#00A84F"></i>REGULAR</span>
      <span><i class="swatch" style="background:#D600A9"></i>SWITCH</span>
      <span><i class="swatch" style="background:#E22020"></i>NOLLIE</span>
      <span><i class="swatch" style="background:#00CFE8"></i>FAKIE</span>
    </div>
    <div>CNKERR.COM</div>
  </div>
</div></div>
<script src="./flatground-tricks-data.js"></script>
<script>
const colors={Regular:"#00A84F",Switch:"#D600A9",Nollie:"#E22020",Fakie:"#00CFE8"};
document.querySelector("#grid").innerHTML=window.FLATGROUND_TRICKS_DATA.map(d=>`<i class="cell" style="background:${colors[d.stance]}"></i>`).join("");
</script>
</body>
</html>
