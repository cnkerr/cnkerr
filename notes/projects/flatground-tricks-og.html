<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1200,initial-scale=1">
<title>Flatground Tricks social card</title>
<style>
:root{--reg:#00A84F;--switch:#D600A9;--nollie:#E22020;--fakie:#00CFE8}
*{box-sizing:border-box}
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#bfbfbf;color:#000}
body{font-family:ui-monospace,Menlo,Monaco,Consolas,monospace;padding:28px}
.frame{width:100%;height:100%;background:#b7b7b7;border:3px solid;border-color:#fff #000 #000 #fff;box-shadow:5px 5px 0 rgba(0,0,0,.28);padding:18px}
.paper{height:100%;background:#fff;border:3px solid #000;padding:34px 38px 32px;display:grid;grid-template-rows:auto auto 1fr auto}
.kicker{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:18px;font-weight:600;letter-spacing:.22em;line-height:1;margin-bottom:7px}
.title{font-family:Didot,"Bodoni 72","Bodoni MT","Times New Roman",serif;font-size:76px;font-weight:700;line-height:.93;letter-spacing:-.035em;white-space:nowrap}
.subtitle{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:20px;font-style:italic;margin-top:12px}
.rule{height:3px;background:#000;margin:28px 0 24px}
.grid{display:grid;grid-template-columns:repeat(100,1fr);gap:3px;align-self:start}
.cell{aspect-ratio:1/1;min-width:0;box-shadow:inset 1px 1px 0 rgba(255,255,255,.4),inset -1px -1px 0 rgba(0,0,0,.32)}
.footer{display:flex;justify-content:space-between;align-items:end;padding-top:20px;font-size:15px;font-weight:800;letter-spacing:.055em}
.footer .right{font-size:13px;opacity:.6}
</style>
</head>
<body>
<div class="frame"><div class="paper">
  <div>
    <div class="kicker">A COMPENDIUM OF</div>
    <div class="title">FLATGROUND TRICKS</div>
    <div class="subtitle">(as performed by Jamie Griffin)</div>
  </div>
  <div class="rule"></div>
  <div class="grid" id="grid"></div>
  <div class="footer"><span>CNKERR.COM</span><span class="right">SORT • SEARCH • EXPLORE</span></div>
</div></div>
<script src="./flatground-tricks-data.js"></script>
<script>
const colors={Regular:"var(--reg)",Switch:"var(--switch)",Nollie:"var(--nollie)",Fakie:"var(--fakie)"};
document.querySelector("#grid").innerHTML=window.FLATGROUND_TRICKS_DATA.map(d=>`<i class="cell" style="background:${colors[d.stance]}"></i>`).join("");
</script>
</body>
</html>
